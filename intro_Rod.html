<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Hover Effects</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card-container {
      display: flex;
      gap: 2rem;
    }

    .card {
      position: relative;
      width: 250px;
      height: 350px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .card-info {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: white;
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      transition: bottom 0.4s ease;
    }

    .card:hover .card-info {
      bottom: 0;
    }

    .card-info h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .card-info p {
      font-size: 0.9rem;
      color: #777;
    }

    .card-info a {
      color: green;
      font-weight: bold;
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80" alt="Nature 1"/>
      <div class="card-info">
        <p>UMak, Philippines</p>
        <h3>Rod Anthony C. Balaoro</h3>
        <a href="#">Read More</a>
      </div>
    </div>
    <div class="card-container">
        <div class="card">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80" alt="Nature 1"/>
          <div class="card-info">
            <p>Vancouver Mountains, Canada</p>
            <h3>The Great Path</h3>
            <a href="#">Read More</a>
          </div>
        </div>
</body>
</html>
